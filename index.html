    <style>
        /* Manteniamo esattamente il tuo stile originale */
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --spark-gold: #d4af37;
            --spark-red: #c0392b;
            --pedal-bg: #2a2a2a;
            --input-bg: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }

        .header-bar {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--spark-gold);
        }

        h1 { color: var(--spark-gold); margin: 0; font-size: 1.5em; font-weight: 800; letter-spacing: 1px; text-align: center; }

        .header-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }

        .btn {
            background-color: var(--spark-gold); color: #000; border: none;
            padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
            display: inline-block; text-align: center; font-size: 0.9em;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background-color: #444; color: white; }

        .preset-card {
            background-color: var(--bg-card); border: 1px solid #333; border-radius: 12px;
            padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative;
        }

        .song-title-input {
            width: 85%; background: transparent; border: none; color: var(--spark-gold); 
            font-size: 1.5em; font-weight: bold; margin-bottom: 15px; outline: none; 
            border-bottom: 1px dashed #555; padding-bottom: 5px;
        }

        .delete-btn {
            position: absolute; top: 15px; right: 15px; background: none; border: none; 
            color: var(--spark-red); font-size: 1.5em; cursor: pointer;
        }

        /*BOTTONI YOUTUBE SPOTIFY*/
        .action-buttons-container {
            display: flex; gap: 10px; margin-left: 35px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .spotify-btn, .youtube-btn {
            color: white; border: none; padding: 6px 12px; border-radius: 12px; 
            font-size: 0.8em; font-weight: bold; text-decoration: none; transition: opacity 0.2s;
            display: inline-block; text-align: center;
        }
        .spotify-btn { background-color: #1DB954; }
        .youtube-btn { background-color: #FF0000; }
        .spotify-btn:hover, .youtube-btn:hover { opacity: 0.8; }

        .drag-handle {
            position: absolute; top: 15px; left: 15px;
            cursor: grab; font-size: 1.6em; color: var(--spark-gold);
            user-select: none;
        }
        .drag-handle:active { cursor: grabbing; }
        
        .preset-card.dragging { 
            opacity: 0.4; border: 2px dashed var(--spark-gold); 
        }
        .preset-card.drag-over { 
            border-top: 4px solid #2ecc71; 
        }

        /*BLOCCO NOTE*/

        .technical-notes {
            width: 100%; background-color: var(--input-bg); color: var(--text-muted);
            border: 1px solid #444; border-radius: 8px; padding: 10px; margin-top: 15px;
            font-family: inherit; font-size: 0.85em; resize: vertical; box-sizing: border-box;
            transition: 0.3s;
        }
        .technical-notes:focus {
            outline: none; border-color: var(--spark-gold); color: var(--text-main);
        }
        

        /* STILE MOTORE DI RICERCA AGGIUNTO */
        .search-box {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; 
            background: #111; color: white; font-size: 0.9em; box-sizing: border-box;
        }
        .suggestion-item {
            padding: 12px; background: #252525; margin-top: 5px; border-radius: 8px; cursor: pointer; 
            font-size: 0.85em; border: 1px solid var(--spark-gold); color: var(--spark-gold); font-weight: bold;
        }
        .user-suggestion { border-color: #2ecc71; color: #2ecc71; }

        .mode-switch {
            display: flex; gap: 0; margin-bottom: 15px; border-radius: 8px; 
            overflow: hidden; border: 1px solid var(--spark-gold);
        }
        .mode-btn {
            flex: 1; padding: 10px; background: #111; color: var(--text-muted); 
            border: none; cursor: pointer; font-weight: bold; font-size: 0.9em; transition: 0.3s;
        }
        .mode-btn.active { background: var(--spark-gold); color: #000; }

        .tabs-container {
            display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #333; 
            padding-bottom: 0px; overflow-x: auto; scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab {
            padding: 10px 15px; background: #222; border-radius: 8px 8px 0 0; color: var(--text-muted); 
            cursor: pointer; font-size: 0.9em; font-weight: bold; white-space: nowrap; 
            border: 1px solid #333; border-bottom: none; transition: background 0.3s;
        }
        .tab.active { background: var(--text-main); color: #000; border-color: var(--text-main); }
        .tab.add-tab { background: transparent; color: var(--spark-gold); border: 1px dashed var(--spark-gold); border-bottom: none; }

        .part-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }

        .song-part-select {
            flex-grow: 1; background-color: var(--input-bg); border: 1px solid #555;
            color: var(--text-main); font-size: 0.9em; outline: none; border-radius: 6px; padding: 6px; font-weight: bold;
        }

        .btn-delete-part {
            background: rgba(192, 57, 43, 0.2); color: var(--spark-red); border: 1px solid var(--spark-red);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-weight: bold;
        }

        /* --- CATENA EFFETTI --- */
        .chain-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; scroll-snap-type: x mandatory; }
        .chain-container::-webkit-scrollbar { height: 8px; }
        .chain-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        .pedal-slot {
            flex: 0 0 135px; background-color: var(--pedal-bg); border-radius: 10px; padding: 12px; 
            display: flex; flex-direction: column; align-items: center; border: 1px solid #444; scroll-snap-align: start;
        }

        .pedal-category { font-size: 0.7em; color: var(--text-muted); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }
        
        .pedal-image { 
            width: 100%; height: 110px; object-fit: contain; margin-bottom: 8px; 
            border-radius: 6px; background-color: #111; padding: 5px; transition: all 0.3s ease; box-sizing: border-box;
        }
        .pedal-image.off { filter: grayscale(100%) brightness(0.4); opacity: 0.7; }

        /* NUOVA CLASSE PER PEDALI VUOTI SENZA INTERNET */
        .pedal-empty-box {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 110px; margin-bottom: 8px; border-radius: 6px;
            background-color: #111; border: 1px dashed #444; color: #555;
            font-size: 0.8em; font-weight: bold; box-sizing: border-box;
        }

        .status-indicator {
            width: 14px; height: 14px; border-radius: 50%; background-color: #555; margin-bottom: 10px;
            cursor: pointer; border: 2px solid #111; transition: all 0.2s;
        }
        .status-indicator.on { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .status-indicator.off { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        .status-indicator.empty { visibility: hidden; } 
        
        .pedal-select {
            width: 100%; background-color: var(--input-bg); color: white; border: 1px solid #555; 
            border-radius: 6px; font-size: 0.75em; padding: 6px; margin-bottom: 10px; outline: none;
        }

        .params-container { width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .param-row { display: flex; justify-content: space-between; align-items: center; background-color: #1a1a1a; padding: 3px 6px; border-radius: 4px; border: 1px solid #444; }
        .param-label { font-size: 0.7em; color: var(--spark-gold); font-weight: bold; }
        .param-val { background-color: #333; color: white; border: 1px solid #555; border-radius: 4px; font-size: 0.75em; padding: 2px 4px; outline: none; cursor: pointer; text-align: center; font-weight: bold; }

        @media (min-width: 768px) {
            .header-bar { flex-direction: row; }
            .header-controls { justify-content: flex-end; width: auto; }
            .pedal-slot { flex: 1; min-width: 0; } 
            .chain-container { overflow-x: visible; justify-content: space-between; }
        }

/* --- MODALITÀ LIVE --- */
        body.live-mode .delete-btn,
        body.live-mode .drag-handle,
        body.live-mode .search-box,
        body.live-mode .suggestion-item,
        body.live-mode .add-tab,
        body.live-mode .btn-delete-part,
        body.live-mode .btn-hide-live,
        body.live-mode .setlist-btn,
        body.live-mode .collapse-btn {
            display: none !important;
        }

        /* LOGICA CASSA: Nascondi lo slot Amp solo in Modalità Live AND se siamo in Setup Fender (mode-input) */
        body.live-mode .preset-card.mode-input .pedal-slot.cat-amp {
            display: none !important;
        }

        /* In modalità live, i pedali vuoti rimangono visibili ma diventano molto trasparenti */
        body.live-mode .pedal-slot.is-empty {
            opacity: 0.15;
            pointer-events: none;
        }

        body.live-mode .song-title-input {
            margin-left: 0 !important; width: 100% !important; 
            text-align: center; font-size: 2em; border-bottom: none; 
            pointer-events: none;
        }

        body.live-mode .action-buttons-container {
            justify-content: center; margin-left: 0 !important;
        }

        body.live-mode .pedal-select, 
        body.live-mode .param-val,
        body.live-mode .song-part-select {
            pointer-events: none; border: none; background: transparent; 
            appearance: none; -webkit-appearance: none; font-size: 1.1em; text-align: center;
        }

        body.live-mode .technical-notes {
            font-size: 1.2em; pointer-events: none; border: 1px dashed var(--spark-gold);
        }
        
        .live-toggle-btn {
            background-color: #e67e22; color: white; border: none;
            padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        body.live-mode .live-toggle-btn {
            background-color: #e74c3c; /* Diventa rosso quando è attiva per ricordarti di spegnerla */
            box-shadow: 0 0 15px #e74c3c;
        }

        /* --- SCHEDE A SCOMPARSA (ACCORDION) --- */
        .collapse-btn {
            position: absolute; top: 15px; right: 45px; 
            background: none; border: none; color: var(--text-muted); 
            font-size: 1.2em; cursor: pointer; transition: color 0.3s;
        }
        .collapse-btn:hover { color: white; }
        
        /* Quando la scheda è chiusa (MA NON siamo in modalità live), nascondi il contenuto */
        body:not(.live-mode) .preset-card.collapsed .search-box,
        body:not(.live-mode) .preset-card.collapsed div[id^="results-"],
        body:not(.live-mode) .preset-card.collapsed .mode-switch,
        body:not(.live-mode) .preset-card.collapsed .tabs-container,
        body:not(.live-mode) .preset-card.collapsed .part-controls,
        body:not(.live-mode) .preset-card.collapsed .chain-container,
        body:not(.live-mode) .preset-card.collapsed .technical-notes {
            display: none !important;
        }

        /* --- SCALETTA LIVE (STELLA) --- */
        .setlist-btn {
            position: absolute; top: 15px; right: 75px; 
            background: none; border: none; font-size: 1.2em; cursor: pointer; transition: 0.3s;
            filter: grayscale(100%) opacity(0.4); /* Stella spenta */
        }
        .setlist-btn.active {
            filter: grayscale(0%) opacity(1); /* Stella accesa (oro) */
        }
        
        /* MAGIA: Nasconde i brani scartati in Modalità Live (solo se c'è una scaletta attiva) */
        body.live-mode.has-setlist .preset-card:not(.in-setlist) {
            display: none !important;
        }      
          
    </style>
</head>

        function migrateToModes(songList) {
            return songList.map(s => {
                if (s.parts && s.parts[0] && s.parts[0].modes) return s;
                let oldParts = s.parts || [ { name: "Accompagnamento", chain: s.chain } ];
                let newParts = oldParts.map(p => {
                    return {
                        name: p.name || "Accompagnamento",
                        modes: {
                            cuffie: JSON.parse(JSON.stringify(p.chain || defaultChain)),
                            input: JSON.parse(JSON.stringify(p.chain || defaultChain))
                        }
                    };
                });
                return {
                    title: s.title,
                    activePartIndex: s.activePartIndex || 0,
                    activeMode: s.activeMode || 'cuffie',
                    parts: newParts
                };
            });
        }

        function renderChain(song, songIndex) {
            const activePart = song.parts[song.activePartIndex];
            const currentChain = activePart.modes[song.activeMode];
            
            return currentChain.map((slot, slotIndex) => {
                let optionsHTML = catalog[slot.category].map(pedal => 
                    `<option value="${pedal.name}" ${pedal.name === slot.name ? 'selected' : ''}>${pedal.name}</option>`
                ).join('');

                let isEmpty = (slot.name === "Nessun Pedale");
                let dotClass = isEmpty ? "empty" : (slot.status === "on" ? "on" : "off");
                let imgClass = slot.status === "on" ? "" : "off";
                
                // 1. SPOSTATO QUI: L'app "capisce" quale pedale è PRIMA di cercare l'immagine
                let pedalData = catalog[slot.category].find(p => p.name === slot.name) || catalog[slot.category][0];

                // 2. ORA DISEGNA L'IMMAGINE SENZA ERRORI
                let imageHTML = "";
                if (isEmpty || !pedalData.img) {
                    imageHTML = `<div class="pedal-empty-box">VUOTO</div>`;
                } else {
                    imageHTML = `<img src="${pedalData.img}" class="pedal-image ${imgClass}" alt="${slot.name}" onerror="this.style.opacity='0'">`;
                }

                // 3. DISEGNA LE MANOPOLE
                let paramsHTML = '';
                if (pedalData.params && pedalData.params.length > 0) {
                    paramsHTML = '<div class="params-container">';
                    pedalData.params.forEach((paramName, pIndex) => {
                        let val = slot.paramValues[pIndex] !== undefined ? slot.paramValues[pIndex] : "5";
                        let valOptions = "";
                        for(let i=0; i<=10; i++) {
                            valOptions += `<option value="${i}" ${val == i ? 'selected' : ''}>${i}</option>`;
                        }
                        paramsHTML += `
                            <div class="param-row">
                                <span class="param-label">${paramName}</span>
                                <select class="param-val" onchange="updateParamValue(${songIndex}, ${slotIndex}, ${pIndex}, this.value)">
                                    ${valOptions}
                                </select>
                            </div>
                        `;
                    });
                    paramsHTML += '</div>';
                }

                return `
                    <div class="pedal-slot ${isEmpty ? 'is-empty' : ''} cat-${slot.category.toLowerCase()}">
                        <span class="pedal-category">${slot.category}</span>
                        ${imageHTML}
                        <div class="status-indicator ${dotClass}" onclick="togglePedal(${songIndex}, ${slotIndex})"></div>
                        <select class="pedal-select" onchange="updatePedal(${songIndex}, ${slotIndex}, this.value)">
                            ${optionsHTML}
                        </select>
                        ${paramsHTML}
                    </div>
                `;
            }).join('');
        }

        // INTELLIGENZA E RICERCA
        function searchPreset(songIndex, query) {
            const resultsContainer = document.getElementById(`results-${songIndex}`);
            if (query.length < 2) { resultsContainer.innerHTML = ""; return; }
            const allSuggestions = [...presetSuggestions, ...personalLibrary];
            const results = allSuggestions.filter(p => p.title.toLowerCase().includes(query.toLowerCase())).slice(0,4);
            
            resultsContainer.innerHTML = results.map(p => `
                <div class="suggestion-item ${p.isUserCreated?'user-suggestion':''}" onclick="applyPreset(${songIndex}, '${p.title.replace(/'/g, "\\'")}')">
                    ${p.isUserCreated ? '✅ Memoria: ' : '🎸 Suggerito: '} ${p.title}
                </div>
            `).join('');
        }

        function applyPreset(songIndex, title) {
            const p = [...presetSuggestions, ...personalLibrary].find(x => x.title === title);
            const currentPart = songs[songIndex].parts[songs[songIndex].activePartIndex];
            
            ['cuffie', 'input'].forEach(mode => {
                currentPart.modes[mode].forEach(slot => {
                    // Di base, prendiamo il pedale suggerito dal database
                    let targetPedalName = p.chain[slot.category];
                    
                    // LA MAGIA: Se siamo nel setup Fender (input) e lo slot è l'Amp, lo svuotiamo!
                    if (mode === 'input' && slot.category === 'Amp') {
                        targetPedalName = "Nessun Pedale";
                    }

                    const found = catalog[slot.category].find(c => c.name === targetPedalName) || catalog[slot.category][0];
                    slot.name = found.name; 
                    slot.img = found.img; 
                    slot.status = slot.name === "Nessun Pedale" ? "off" : "on";
                    slot.paramValues = found.params.map(() => "5");
                });
            });
            
            renderApp();
        }

        function learn() {
            songs.forEach(s => {
                const libName = s.title + " (Salvato)";
                if(!personalLibrary.find(x => x.title === libName)) {
                    let c = {}; 
                    s.parts[0].modes.cuffie.forEach(slot => c[slot.category] = slot.name);
                    personalLibrary.push({title: libName, chain: c, isUserCreated: true});
                }
            });
            localStorage.setItem('sparkPersonalLibrary', JSON.stringify(personalLibrary));
        }

        // --- GESTIONE LOGICA ---
        function switchMode(songIndex, mode) { 
            const song = songs[songIndex];
            const activePart = song.parts[song.activePartIndex];
            
            // Se passiamo a 'input' e la catena è vuota, copiamo quella delle 'cuffie' come base
            if (mode === 'input') {
                const isEmpty = activePart.modes.input.every(slot => slot.name === "Nessun Pedale");
                if (isEmpty) {
                    activePart.modes.input = JSON.parse(JSON.stringify(activePart.modes.cuffie));
                    // Rimuoviamo l'amplificatore dalla modalità input (Setup Fender)
                    const ampSlot = activePart.modes.input.find(s => s.category === 'Amp');
                    if (ampSlot) {
                        ampSlot.name = "Nessun Pedale";
                        ampSlot.img = "";
                        ampSlot.status = "off";
                    }
                }
            }
            
            song.activeMode = mode; 
            renderApp(); 
        }
        function switchPart(songIndex, pIdx) { songs[songIndex].activePartIndex = pIdx; renderApp(); }
        function updateSongTitle(sIdx, val) { songs[sIdx].title = val; renderApp(); }
        function updatePartName(sIdx, val) { songs[sIdx].parts[songs[sIdx].activePartIndex].name = val; renderApp(); }
        
        function addPart(sIdx) {
            songs[sIdx].parts.push({ name: "Nuova Parte", modes: { cuffie: JSON.parse(JSON.stringify(defaultChain)), input: JSON.parse(JSON.stringify(defaultChain)) } });
            songs[sIdx].activePartIndex = songs[sIdx].parts.length - 1;
            renderApp();
        }

        function deletePart(sIdx) {
            if(confirm("Eliminare parte?")) { songs[sIdx].parts.splice(songs[sIdx].activePartIndex, 1); songs[sIdx].activePartIndex = 0; renderApp(); }
        }

        function togglePedal(sIdx, slIdx) {
            const slot = songs[sIdx].parts[songs[sIdx].activePartIndex].modes[songs[sIdx].activeMode][slIdx];
            if (slot.name !== "Nessun Pedale") { slot.status = slot.status === "on" ? "off" : "on"; renderApp(); }
        }

        function updatePedal(sIdx, slIdx, name) {
            const slot = songs[sIdx].parts[songs[sIdx].activePartIndex].modes[songs[sIdx].activeMode][slIdx];
            const data = catalog[slot.category].find(p => p.name === name);
            slot.name = data.name; slot.img = data.img; slot.status = name === "Nessun Pedale" ? "off" : "on";
            slot.paramValues = data.params.map(() => "5");
            renderApp();
        }

        function updateParamValue(sIdx, slIdx, pIdx, val) {
            songs[sIdx].parts[songs[sIdx].activePartIndex].modes[songs[sIdx].activeMode][slIdx].paramValues[pIdx] = val;
            localStorage.setItem('sparkPresetsV7', JSON.stringify(songs));
        }

        function addSong() {
            songs.unshift({ title: "Nuovo Brano", activePartIndex: 0, activeMode: "cuffie", parts: [{ name: "Accompagnamento", modes: { cuffie: JSON.parse(JSON.stringify(defaultChain)), input: JSON.parse(JSON.stringify(defaultChain)) } }] });
            renderApp();
        }

        function deleteSong(idx) { if(confirm("Eliminare brano?")) { songs.splice(idx, 1); renderApp(); } }

        function exportData() {
            learn();
            const blob = new Blob([JSON.stringify(songs, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "spark_presets_pro.json"; a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { try { songs = migrateToModes(JSON.parse(ev.target.result)); learn(); renderApp(); } catch(err) { alert("Errore file"); } };
            reader.readAsText(e.target.files[0]);
        }

        /*FUNZIONA BLOCCO NOTE*/

        function updateNotes(sIdx, val) { 
            songs[sIdx].notes = val; 
            localStorage.setItem('sparkPresetsV7', JSON.stringify(songs)); 
        }

        // --- FUNZIONE SCHEDE A SCOMPARSA ---
        function toggleCollapse(sIdx) {
            // Inverte lo stato della canzone (da aperta a chiusa e viceversa)
            songs[sIdx].isCollapsed = !songs[sIdx].isCollapsed;
            renderApp();
        }

        // --- FUNZIONI DRAG & DROP ---
        let draggedIndex = null;

        function dragStart(e, index) {
            draggedIndex = index;
            e.dataTransfer.effectAllowed = 'move';
            // Un piccolo ritardo permette al browser di generare l'immagine "fantasma" prima di rendere trasparente la scheda
            setTimeout(() => e.target.classList.add('dragging'), 0);
        }

        function dragOver(e) {
            e.preventDefault(); // Necessario per permettere il rilascio (drop)
            e.dataTransfer.dropEffect = 'move';
        }

        function dragEnter(e) {
            e.preventDefault();
            // Aggiunge la linea verde sopra la scheda su cui stiamo passando
            if (e.currentTarget.classList.contains('preset-card')) {
                e.currentTarget.classList.add('drag-over');
            }
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e, dropIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            // Se stiamo rilasciando la scheda nello stesso punto, annulla
            if (draggedIndex === null || draggedIndex === dropIndex) return;

            // Rimuove il brano dalla vecchia posizione e lo inserisce nella nuova
            const itemToMove = songs.splice(draggedIndex, 1)[0];
            songs.splice(dropIndex, 0, itemToMove);
            
            draggedIndex = null;
            renderApp(); // Ricarica tutto con il nuovo ordine salvandolo in automatico!
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('drag-over'));
        }

        // --- FUNZIONE MODALITÀ LIVE ---
        let isLive = false;
        function toggleLiveMode() {
            isLive = !isLive;
            
            // Controlla se c'è almeno un brano con la stella accesa
            const hasStarredSongs = songs.some(s => s.isSetlist);
            
            if (isLive) {
                document.body.classList.add('live-mode');
                // Se hai preparato la scaletta, attiva il filtro che nasconde le altre!
                if (hasStarredSongs) document.body.classList.add('has-setlist');
                
                document.getElementById('liveBtn').innerHTML = "❌ Esci da Live";
            } else {
                document.body.classList.remove('live-mode');
                document.body.classList.remove('has-setlist');
                document.getElementById('liveBtn').innerHTML = "🎸 Modalità Live";
            }
        }

        // --- FUNZIONE AGGIUNGI A SCALETTA ---
        function toggleSetlist(sIdx) {
            songs[sIdx].isSetlist = !songs[sIdx].isSetlist;
            renderApp();
        }

        window.onload = function() { if(songs.length === 0) addSong(); else renderApp(); };
    </script>
</body>
</html>
