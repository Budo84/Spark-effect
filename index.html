<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark Preset Editor - Live Edition</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <style>
        :root {
            --bg-dark: #121212; --bg-card: #1e1e1e; --text-main: #f0f0f0;
            --spark-gold: #d4af37; --spark-red: #c0392b; --pedal-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            margin: 0; padding: 15px; padding-bottom: 90px;
        }

        /* --- STILI LIVE MODE AGGIORNATI --- */
        body.live-mode .delete-btn, body.live-mode .drag-handle, 
        body.live-mode .search-box, body.live-mode .add-tab, 
        body.live-mode .btn-delete-part, body.live-mode .btn-hide-live,
        body.live-mode .setlist-btn { display: none !important; }

        /* Nascondi AMP solo in Setup Fender + Live Mode */
        body.live-mode .preset-card.mode-input .pedal-slot.cat-amp { display: none !important; }

        /* Pedali vuoti trasparenti in Live Mode per non distrarre */
        body.live-mode .pedal-slot.is-empty { opacity: 0.15; pointer-events: none; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .preset-card { background: var(--bg-card); border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; position: relative; }
        .chain-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .pedal-slot { background: var(--pedal-bg); min-width: 120px; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #444; }
        .pedal-image { width: 100%; height: 80px; object-fit: contain; margin: 5px 0; }
        .pedal-image.off { filter: grayscale(1) brightness(0.5); }
        .param-row { display: flex; justify-content: space-between; font-size: 0.7em; color: var(--spark-gold); margin-top: 4px; }
        .param-val { background: transparent; color: white; border: none; font-size: 1em; }
        
        .nav-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid var(--spark-gold); z-index: 100; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-gold { background: var(--spark-gold); color: black; }
        .btn-live { background: #e67e22; color: white; }
        body.live-mode .btn-live { background: var(--spark-red); box-shadow: 0 0 15px var(--spark-red); }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🎸 My Rig</h1>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-gold" onclick="exportJSON()">📤 Backup</button>
            <label class="btn btn-gold">📥 Importa <input type="file" id="importFile" hidden onchange="importJSON(event)"></label>
        </div>
    </div>

    <div id="app"></div>

    <div class="nav-footer">
        <button class="btn btn-gold" onclick="addSong()">➕ Brano</button>
        <a href="labs.html" class="btn btn-gold" style="text-decoration:none">🧪 Labs</a>
        <button id="liveBtn" class="btn btn-live" onclick="toggleLiveMode()">🎸 Live Mode</button>
    </div>

    <script src="catalog.js"></script>
    <script src="cloud_presets.js"></script>

    <script>
        let songs = JSON.parse(localStorage.getItem('sparkPresetsV7')) || [];

        function save() { localStorage.setItem('sparkPresetsV7', JSON.stringify(songs)); }

        function renderApp() {
            const container = document.getElementById('app');
            container.innerHTML = songs.map((song, sIdx) => `
                <div class="preset-card ${song.activeMode === 'input' ? 'mode-input' : ''}">
                    <input class="song-title-input" value="${song.title}" onchange="songs[${sIdx}].title=this.value; save()">
                    
                    <div class="mode-selector">
                        <button class="${song.activeMode === 'cuffie' ? 'active' : ''}" onclick="switchMode(${sIdx}, 'cuffie')">🎧 Cuffie</button>
                        <button class="${song.activeMode === 'input' ? 'active' : ''}" onclick="switchMode(${sIdx}, 'input')">🎸 Fender Input</button>
                    </div>

                    <div class="chain-container">
                        ${renderChain(song, sIdx)}
                    </div>

                    <div class="footer-card">
                        <textarea placeholder="Note tecniche..." onchange="songs[${sIdx}].notes=this.value; save()">${song.notes || ''}</textarea>
                        <button class="btn-delete-part" onclick="deleteSong(${sIdx})">🗑️ Elimina</button>
                    </div>
                </div>
            `).join('');
        }

        function renderChain(song, sIdx) {
            const activePart = song.parts[song.activePartIndex];
            const currentChain = activePart.modes[song.activeMode];
            
            return currentChain.map((slot, pIdx) => {
                const pedalData = catalog[slot.category].find(p => p.name === slot.name) || catalog[slot.category][0];
                const isEmpty = slot.name === "Nessun Pedale";
                
                let imageHTML = isEmpty ? '<div style="height:80px; display:flex; align-items:center; justify-content:center; color:#555">VUOTO</div>' 
                                      : `<img src="${pedalData.img}" class="pedal-image ${slot.status === 'on' ? '' : 'off'}" onclick="togglePedal(${sIdx}, ${pIdx})">`;

                let paramsHTML = (pedalData.params || []).map((pName, pValIdx) => `
                    <div class="param-row">
                        <span>${pName}</span>
                        <select class="param-val" onchange="updateParam(${sIdx}, ${pIdx}, ${pValIdx}, this.value)">
                            ${[...Array(11).keys()].map(v => `<option value="${v}" ${slot.paramValues[pValIdx] == v ? 'selected' : ''}>${v}</option>`).join('')}
                        </select>
                    </div>
                `).join('');

                return `
                    <div class="pedal-slot ${isEmpty ? 'is-empty' : ''} cat-${slot.category.toLowerCase()}">
                        <small>${slot.category}</small>
                        ${imageHTML}
                        <select onchange="updatePedal(${sIdx}, ${pIdx}, this.value)">
                            ${catalog[slot.category].map(p => `<option value="${p.name}" ${p.name === slot.name ? 'selected' : ''}>${p.name}</option>`).join('')}
                        </select>
                        ${paramsHTML}
                    </div>
                `;
            }).join('');
        }

        function switchMode(sIdx, mode) {
            const song = songs[sIdx];
            const part = song.parts[0];
            if (mode === 'input' && part.modes.input.every(s => s.name === "Nessun Pedale")) {
                part.modes.input = JSON.parse(JSON.stringify(part.modes.cuffie));
                const amp = part.modes.input.find(s => s.category === 'Amp');
                if (amp) { amp.name = "Nessun Pedale"; amp.status = "off"; }
            }
            song.activeMode = mode;
            save(); renderApp();
        }

        function updatePedal(sIdx, pIdx, name) {
            songs[sIdx].parts[0].modes[songs[sIdx].activeMode][pIdx].name = name;
            songs[sIdx].parts[0].modes[songs[sIdx].activeMode][pIdx].status = (name === "Nessun Pedale") ? "off" : "on";
            save(); renderApp();
        }

        function togglePedal(sIdx, pIdx) {
            const slot = songs[sIdx].parts[0].modes[songs[sIdx].activeMode][pIdx];
            if (slot.name !== "Nessun Pedale") {
                slot.status = slot.status === 'on' ? 'off' : 'on';
                save(); renderApp();
            }
        }

        function updateParam(sIdx, pIdx, vIdx, val) {
            songs[sIdx].parts[0].modes[songs[sIdx].activeMode][pIdx].paramValues[vIdx] = val;
            save();
        }

        function addSong() {
            const newSong = {
                title: "Nuovo Brano", activeMode: "cuffie", activePartIndex: 0,
                parts: [{ name: "Main", modes: { cuffie: JSON.parse(JSON.stringify(defaultChain)), input: JSON.parse(JSON.stringify(defaultChain)) } }]
            };
            songs.unshift(newSong); save(); renderApp();
        }

        function deleteSong(idx) { if(confirm("Eliminare?")) { songs.splice(idx,1); save(); renderApp(); } }

        function toggleLiveMode() {
            isLive = !isLive;
            document.body.classList.toggle('live-mode', isLive);
            document.getElementById('liveBtn').innerHTML = isLive ? "❌ Esci" : "🎸 Live Mode";
        }

        function exportJSON() {
            const data = JSON.stringify(songs);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'backup_spark.json'; a.click();
        }

        function importJSON(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                songs = JSON.parse(event.target.result);
                save(); renderApp();
            };
            reader.readAsText(file);
        }

        window.onload = () => { if(songs.length === 0) addSong(); else renderApp(); };
    </script>
</body>
</html>
