<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark Editor</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f0f0f0;
            --spark-gold: #d4af37;
            --spark-red: #c0392b;
            --pedal-bg: #222;
            --input-bg: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--spark-gold);
        }

        h1 { color: var(--spark-gold); margin: 0; font-size: 1.5em; font-weight: 800; }

        .btn {
            background-color: var(--spark-gold); color: #000; border: none;
            padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .btn:active { opacity: 0.8; transform: translateY(2px); }

        .preset-card {
            background-color: var(--bg-card); border-radius: 12px;
            padding: 20px 15px; margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            position: relative;
            border-top: 3px solid #333;
        }

        .song-title-input {
            width: 85%; background: transparent; border: none;
            color: var(--spark-gold); font-size: 1.4em; font-weight: bold;
            margin-bottom: 8px; outline: none; border-bottom: 1px dashed #555;
            padding-bottom: 5px;
        }

        .song-part-input {
            width: 85%; background: transparent; border: none;
            color: var(--text-main); font-size: 1em; outline: none;
            border-bottom: 1px dashed #555; margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .delete-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(192, 57, 43, 0.2); border: none; color: var(--spark-red); 
            font-size: 1.2em; border-radius: 50%; width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .chain-container {
            display: flex; gap: 10px; overflow-x: auto;
            padding-bottom: 15px; scroll-snap-type: x mandatory;
        }
        .chain-container::-webkit-scrollbar { height: 8px; }
        .chain-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        .pedal-slot {
            flex: 0 0 130px;
            background-color: var(--pedal-bg); border-radius: 10px;
            padding: 12px; display: flex; flex-direction: column; align-items: center;
            border: 1px solid #444; scroll-snap-align: start;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .pedal-category { 
            font-size: 0.75em; color: var(--spark-gold); 
            text-transform: uppercase; font-weight: bold; margin-bottom: 10px; 
            letter-spacing: 1px;
        }
        
        .pedal-image { 
            width: 100%; height: 110px; object-fit: contain; 
            margin-bottom: 12px; border-radius: 6px; 
            background-color: #181818; padding: 5px;
        }
        
        .pedal-select {
            width: 100%; background-color: var(--input-bg); color: white;
            border: 1px solid #555; border-radius: 6px; font-size: 0.8em;
            padding: 6px; margin-bottom: 8px; outline: none;
        }
        
        .settings-input {
            width: 100%; background-color: var(--input-bg); color: var(--text-main);
            border: 1px solid #555; border-radius: 6px; font-size: 0.75em;
            padding: 6px; text-align: center; box-sizing: border-box;
            outline: none; transition: border 0.3s;
        }
        .settings-input:focus { border-color: var(--spark-gold); }

        @media (min-width: 768px) {
            .pedal-slot { flex: 1; min-width: 0; } 
            .chain-container { overflow-x: visible; justify-content: space-between; }
            .preset-card { padding: 30px; }
        }
    </style>
</head>
<body>

                { name: "07 Hall Medium", img: "7-Reverb/Reverb-07-Hall-Medium.jpg" },

        const defaultSong = {
            title: "Titolo Brano", 
            part: "Accompagno / Assolo",
            chain: [
                { category: "Gate", name: "Spento", img: "", settings: "" },
                { category: "Comp", name: "Spento", img: "", settings: "" },
                { category: "Drive", name: "Spento", img: "", settings: "" },
                { category: "Amp", name: "Spento", img: "", settings: "" },
                { category: "Mod", name: "Spento", img: "", settings: "" },
                { category: "Delay", name: "Spento", img: "", settings: "" },
                { category: "Reverb", name: "Spento", img: "", settings: "" }
            ]
        };

        let songs = JSON.parse(localStorage.getItem('sparkPresetsApp')) || [];

        function renderApp() {
            const container = document.getElementById('preset-list');
            container.innerHTML = '';

            songs.forEach((song, songIndex) => {
                const card = document.createElement('div');
                card.className = 'preset-card';

                let chainHTML = '';
                
                song.chain.forEach((slot, slotIndex) => {
                    let optionsHTML = catalog[slot.category].map(pedal => 
                        `<option value="${pedal.name}" ${pedal.name === slot.name ? 'selected' : ''}>${pedal.name}</option>`
                    ).join('');

                    // Logica Immagine: se è "Spento" mostra icona nera SPENTO, altrimenti carica l'immagine corretta
                    let imgSrc = slot.img ? slot.img : `https://via.placeholder.com/130x150/111/d4af37?text=SPENTO`;

                    chainHTML += `
                        <div class="pedal-slot">
                            <span class="pedal-category">${slot.category}</span>
                            
                            <img src="${imgSrc}" class="pedal-image" 
                                onerror="this.src='https://via.placeholder.com/130x150/111/c0392b?text=NO+FOTO'" 
                                alt="${slot.name}">
                            
                            <select class="pedal-select" onchange="updatePedal(${songIndex}, ${slotIndex}, this.value)">
                                ${optionsHTML}
                            </select>

                            <input type="text" class="settings-input" placeholder="Parametri" 
                                value="${slot.settings}" onchange="updateSettings(${songIndex}, ${slotIndex}, this.value)">
                        </div>
                    `;
                });

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteSong(${songIndex})" title="Elimina Preset">✖</button>
                    <input type="text" class="song-title-input" value="${song.title}" onchange="updateSongInfo(${songIndex}, 'title', this.value)" placeholder="Nome della Canzone">
                    <input type="text" class="song-part-input" value="${song.part}" onchange="updateSongInfo(${songIndex}, 'part', this.value)" placeholder="Es. Assolo / Ritornello">
                    
                    <div class="chain-container">
                        ${chainHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            localStorage.setItem('sparkPresetsApp', JSON.stringify(songs));
        }

        function updateSongInfo(songIndex, field, value) { 
            songs[songIndex][field] = value; 
            renderApp(); 
        }
        
        function updatePedal(songIndex, slotIndex, newPedalName) {
            const category = songs[songIndex].chain[slotIndex].category;
            const pedalData = catalog[category].find(p => p.name === newPedalName);
            if (pedalData) {
                songs[songIndex].chain[slotIndex].name = pedalData.name;
                songs[songIndex].chain[slotIndex].img = pedalData.img;
            }
            renderApp();
        }

        function updateSettings(songIndex, slotIndex, value) { 
            songs[songIndex].chain[slotIndex].settings = value; 
            renderApp(); 
        }

        function addSong() { 
            songs.unshift(JSON.parse(JSON.stringify(defaultSong))); 
            renderApp(); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteSong(index) { 
            if(confirm("Sei sicuro di voler eliminare questo preset?")) { 
                songs.splice(index, 1); 
                renderApp(); 
            } 
        }

        window.onload = function() {
            if(songs.length === 0) addSong();
            else renderApp();
        };
    </script>
</body>
</html>
