<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark Editor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f0f0f0;
            --spark-gold: #d4af37;
            --spark-red: #c0392b;
            --pedal-bg: #222;
            --input-bg: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px; /* Spazio per lo scroll su mobile */
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--spark-gold);
        }

        h1 { color: var(--spark-gold); margin: 0; font-size: 1.5em; font-weight: 800; }

        .btn {
            background-color: var(--spark-gold); color: #000; border: none;
            padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .btn:active { opacity: 0.8; }
        .btn-danger { background-color: var(--spark-red); color: white; }

        .preset-card {
            background-color: var(--bg-card); border-radius: 12px;
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .song-title-input {
            width: 100%; background: transparent; border: none;
            color: var(--spark-gold); font-size: 1.4em; font-weight: bold;
            margin-bottom: 5px; outline: none; border-bottom: 1px dashed #555;
        }

        .song-part-input {
            width: 100%; background: transparent; border: none;
            color: var(--text-main); font-size: 1em; outline: none;
            border-bottom: 1px dashed #555; margin-bottom: 15px;
        }

        .delete-btn {
            position: absolute; top: 15px; right: 15px;
            background: none; border: none; color: var(--spark-red); font-size: 1.2em;
        }

        /* Scorrimento orizzontale in stile App originale */
        .chain-container {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 10px; scroll-snap-type: x mandatory;
        }
        .chain-container::-webkit-scrollbar { height: 6px; }
        .chain-container::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .pedal-slot {
            flex: 0 0 110px; /* Larghezza fissa per ogni slot */
            background-color: var(--pedal-bg); border-radius: 8px;
            padding: 10px; display: flex; flex-direction: column; align-items: center;
            border: 1px solid #444; scroll-snap-align: start;
        }

        .pedal-category { font-size: 0.7em; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        
        .pedal-image { width: 100%; height: 90px; object-fit: contain; margin-bottom: 10px; border-radius: 4px; }
        
        .pedal-select {
            width: 100%; background-color: var(--input-bg); color: white;
            border: 1px solid #555; border-radius: 4px; font-size: 0.75em;
            padding: 4px; margin-bottom: 5px;
        }
        
        .settings-input {
            width: 100%; background-color: var(--input-bg); color: var(--spark-gold);
            border: 1px solid #555; border-radius: 4px; font-size: 0.75em;
            padding: 4px; text-align: center; box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .pedal-slot { flex: 1; min-width: 0; } /* Su tablet/PC si adatta allo schermo */
            .chain-container { overflow-x: visible; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>SPARK EDITOR</h1>
        <button class="btn" onclick="addSong()">+ Aggiungi Brano</button>
    </div>

    <div id="preset-list"></div>

    <script>
        // Registrazione del Service Worker per l'installazione PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("Service Worker Registrato!"));
        }

        // --- INSERISCI QUI IL NOME ESATTO DELLE TUE IMMAGINI SU GITHUB ---
        // Attenzione: i nomi in 'img' devono corrispondere esattamente ai file nella tua repo!
        const catalog = {
            "Gate": [
                { name: "Spento", img: "gate_off.jpg" },
                { name: "Noise Gate", img: "gate_noisegate.jpg" }
            ],
            "Comp": [
                { name: "Spento", img: "comp_off.jpg" },
                { name: "LA Comp", img: "comp_lacomp.jpg" }
            ],
            "Drive": [
                { name: "Spento", img: "drive_off.jpg" },
                { name: "Booster", img: "drive_booster.jpg" },
                { name: "Black Op", img: "drive_blackop.jpg" },
                { name: "Guitar Muff", img: "drive_muff.jpg" }
            ],
            "Amp": [
                { name: "Spento", img: "amp_off.jpg" },
                { name: "Fender 65R", img: "amp_fender.jpg" }
            ],
            "Mod": [
                { name: "Spento", img: "mod_off.jpg" },
                { name: "EQ Pedal", img: "mod_eq.jpg" },
                { name: "Chorus", img: "mod_chorus.jpg" }
            ],
            "Delay": [
                { name: "Spento", img: "delay_off.jpg" },
                { name: "Echotape", img: "delay_echotape.jpg" }
            ],
            "Reverb": [
                { name: "Spento", img: "reverb_off.jpg" }
            ]
        };

        const defaultSong = {
            title: "Nuovo Brano", part: "Accompagno / Assolo",
            chain: [
                { category: "Gate", name: "Spento", img: "gate_off.jpg", settings: "" },
                { category: "Comp", name: "Spento", img: "comp_off.jpg", settings: "" },
                { category: "Drive", name: "Spento", img: "drive_off.jpg", settings: "" },
                { category: "Amp", name: "Spento", img: "amp_off.jpg", settings: "" },
                { category: "Mod", name: "Spento", img: "mod_off.jpg", settings: "" },
                { category: "Delay", name: "Spento", img: "delay_off.jpg", settings: "" },
                { category: "Reverb", name: "Spento", img: "reverb_off.jpg", settings: "" }
            ]
        };

        let songs = JSON.parse(localStorage.getItem('sparkPresetsApp')) || [];

        // Funzione per pescare le immagini dalla tua repo (se sono nella cartella principale)
        function getImageUrl(imgName) {
            // Se hai messo le immagini in una cartella chiamata "images", usa: return 'images/' + imgName;
            return imgName; 
        }

        function renderApp() {
            const container = document.getElementById('preset-list');
            container.innerHTML = '';

            songs.forEach((song, songIndex) => {
                const card = document.createElement('div');
                card.className = 'preset-card';

                let chainHTML = '';
                song.chain.forEach((slot, slotIndex) => {
                    let optionsHTML = catalog[slot.category].map(pedal => 
                        `<option value="${pedal.name}" ${pedal.name === slot.name ? 'selected' : ''}>${pedal.name}</option>`
                    ).join('');

                    chainHTML += `
                        <div class="pedal-slot">
                            <span class="pedal-category">${slot.category}</span>
                            <img src="${getImageUrl(slot.img)}" class="pedal-image" onerror="this.src='https://via.placeholder.com/70x100/333/d4af37?text=${slot.category}'" alt="${slot.name}">
                            
                            <select class="pedal-select" onchange="updatePedal(${songIndex}, ${slotIndex}, this.value)">
                                ${optionsHTML}
                            </select>

                            <input type="text" class="settings-input" placeholder="Parametri" 
                                value="${slot.settings}" onchange="updateSettings(${songIndex}, ${slotIndex}, this.value)">
                        </div>
                    `;
                });

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteSong(${songIndex})">🗑️</button>
                    <input type="text" class="song-title-input" value="${song.title}" onchange="updateSongInfo(${songIndex}, 'title', this.value)" placeholder="Titolo">
                    <input type="text" class="song-part-input" value="${song.part}" onchange="updateSongInfo(${songIndex}, 'part', this.value)" placeholder="Parte (es. Assolo)">
                    
                    <div class="chain-container">
                        ${chainHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            localStorage.setItem('sparkPresetsApp', JSON.stringify(songs));
        }

        function updateSongInfo(songIndex, field, value) { songs[songIndex][field] = value; renderApp(); }
        
        function updatePedal(songIndex, slotIndex, newPedalName) {
            const category = songs[songIndex].chain[slotIndex].category;
            const pedalData = catalog[category].find(p => p.name === newPedalName);
            if (pedalData) {
                songs[songIndex].chain[slotIndex].name = pedalData.name;
                songs[songIndex].chain[slotIndex].img = pedalData.img;
            }
            renderApp();
        }

        function updateSettings(songIndex, slotIndex, value) { songs[songIndex].chain[slotIndex].settings = value; renderApp(); }
        function addSong() { songs.unshift(JSON.parse(JSON.stringify(defaultSong))); renderApp(); }
        function deleteSong(index) { if(confirm("Eliminare brano?")) { songs.splice(index, 1); renderApp(); } }

        window.onload = function() {
            if(songs.length === 0) addSong();
            else renderApp();
        };
    </script>
</body>
</html>
