<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark Preset Editor</title>
    
    <style>
        /* Tema Scuro stile Spark App */
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --spark-gold: #d4af37;
            --spark-red: #c0392b;
            --pedal-bg: #2a2a2a;
            --input-bg: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--spark-gold);
        }

        h1 { color: var(--spark-gold); margin: 0; font-size: 1.5em; font-weight: 800; letter-spacing: 1px; }

        .btn {
            background-color: var(--spark-gold); color: #000; border: none;
            padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .btn:active { opacity: 0.8; }

        .preset-card {
            background-color: var(--bg-card);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .song-title-input {
            width: 85%; background: transparent; border: none;
            color: var(--spark-gold); font-size: 1.4em; font-weight: bold;
            margin-bottom: 8px; outline: none; border-bottom: 1px dashed #555;
            padding-bottom: 5px;
        }

        /* Nuovo stile per il menù a tendina Accompagnamento/Assolo */
        .song-part-select {
            width: 85%; background-color: var(--input-bg); border: 1px solid #555;
            color: var(--text-main); font-size: 0.9em; outline: none; border-radius: 6px;
            margin-bottom: 20px; padding: 6px; font-weight: bold;
        }

        .delete-btn {
            position: absolute; top: 15px; right: 15px;
            background: none; border: none; color: var(--spark-red); 
            font-size: 1.5em; cursor: pointer;
        }

        .chain-container {
            display: flex; gap: 10px; overflow-x: auto;
            padding-bottom: 15px; scroll-snap-type: x mandatory;
        }
        .chain-container::-webkit-scrollbar { height: 8px; }
        .chain-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        .pedal-slot {
            flex: 0 0 135px;
            background-color: var(--pedal-bg); border-radius: 10px;
            padding: 12px; display: flex; flex-direction: column; align-items: center;
            border: 1px solid #444; scroll-snap-align: start;
        }

        .pedal-category { 
            font-size: 0.7em; color: var(--text-muted); 
            text-transform: uppercase; font-weight: bold; margin-bottom: 5px; 
            letter-spacing: 1px;
        }
        
        .pedal-image { 
            width: 100%; height: 110px; object-fit: contain; 
            margin-bottom: 8px; border-radius: 6px; 
            background-color: #111; padding: 5px;
            transition: all 0.3s ease;
        }

        .pedal-image.off {
            filter: grayscale(100%) brightness(0.4);
            opacity: 0.7;
        }

        .status-indicator {
            width: 14px; height: 14px; border-radius: 50%;
            background-color: #555; margin-bottom: 10px;
            cursor: pointer; border: 2px solid #111;
            transition: all 0.2s;
        }
        .status-indicator.on { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .status-indicator.off { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        .status-indicator.empty { visibility: hidden; } 
        
        .pedal-select {
            width: 100%; background-color: var(--input-bg); color: white;
            border: 1px solid #555; border-radius: 6px; font-size: 0.75em;
            padding: 6px; margin-bottom: 10px; outline: none;
        }

        .params-container {
            width: 100%; display: flex; flex-direction: column; gap: 5px;
        }
        
        .param-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1a1a1a; padding: 3px 6px; 
            border-radius: 4px; border: 1px solid #444;
        }
        
        .param-label {
            font-size: 0.7em; color: var(--spark-gold); font-weight: bold;
        }
        
        .param-val {
            background-color: #333; color: white; border: 1px solid #555;
            border-radius: 4px; font-size: 0.75em; padding: 2px 4px; outline: none;
            cursor: pointer; text-align: center; font-weight: bold;
        }

        @media (min-width: 768px) {
            .pedal-slot { flex: 1; min-width: 0; } 
            .chain-container { overflow-x: visible; justify-content: space-between; }
        }
    </style>
</head>
<body>

        const defaultSong = {
            title: "Titolo Brano", 
            part: "Accompagnamento",
            chain: [
                { category: "Gate", name: "Nessun Pedale", img: "", status: "on", paramValues: [] },
                { category: "Comp", name: "Nessun Pedale", img: "", status: "on", paramValues: [] },
                { category: "Drive", name: "Nessun Pedale", img: "", status: "on", paramValues: [] },
                { category: "Amp", name: "Nessun Pedale", img: "", status: "on", paramValues: [] },
                { category: "Mod", name: "Nessun Pedale", img: "", status: "on", paramValues: [] },
                { category: "Delay", name: "Nessun Pedale", img: "", status: "on", paramValues: [] },
                { category: "Reverb", name: "Nessun Pedale", img: "", status: "on", paramValues: [] }
            ]
        };

        let songs = JSON.parse(localStorage.getItem('sparkPresetsV5')) || [];

        function renderApp() {
            const container = document.getElementById('preset-list');
            container.innerHTML = '';

            songs.forEach((song, songIndex) => {
                const card = document.createElement('div');
                card.className = 'preset-card';

                let chainHTML = '';
                
                song.chain.forEach((slot, slotIndex) => {
                    let optionsHTML = catalog[slot.category].map(pedal => 
                        `<option value="${pedal.name}" ${pedal.name === slot.name ? 'selected' : ''}>${pedal.name}</option>`
                    ).join('');

                    let isEmpty = (slot.name === "Nessun Pedale");
                    let dotClass = isEmpty ? "empty" : (slot.status === "on" ? "on" : "off");
                    let imgClass = slot.status === "on" ? "" : "off";
                    let imgSrc = slot.img ? slot.img : `https://via.placeholder.com/130x150/111/444?text=VUOTO`;

                    let paramsHTML = '';
                    let pedalData = catalog[slot.category].find(p => p.name === slot.name) || catalog[slot.category][0];
                    
                    if (pedalData.params && pedalData.params.length > 0) {
                        paramsHTML = '<div class="params-container">';
                        pedalData.params.forEach((paramName, pIndex) => {
                            let val = slot.paramValues[pIndex] !== undefined ? slot.paramValues[pIndex] : "5";
                            let valOptions = "";
                            for(let i=0; i<=10; i++) {
                                valOptions += `<option value="${i}" ${val == i ? 'selected' : ''}>${i}</option>`;
                            }

                            paramsHTML += `
                                <div class="param-row">
                                    <span class="param-label">${paramName}</span>
                                    <select class="param-val" onchange="updateParamValue(${songIndex}, ${slotIndex}, ${pIndex}, this.value)">
                                        ${valOptions}
                                    </select>
                                </div>
                            `;
                        });
                        paramsHTML += '</div>';
                    }

                    chainHTML += `
                        <div class="pedal-slot">
                            <span class="pedal-category">${slot.category}</span>
                            
                            <img src="${imgSrc}" class="pedal-image ${imgClass}" 
                                onerror="this.src='https://via.placeholder.com/130x150/111/c0392b?text=NO+FOTO'">
                            
                            <div class="status-indicator ${dotClass}" onclick="togglePedal(${songIndex}, ${slotIndex})"></div>

                            <select class="pedal-select" onchange="updatePedal(${songIndex}, ${slotIndex}, this.value)">
                                ${optionsHTML}
                            </select>

                            ${paramsHTML}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteSong(${songIndex})" title="Elimina">✖</button>
                    <input type="text" class="song-title-input" value="${song.title}" onchange="updateSongInfo(${songIndex}, 'title', this.value)" placeholder="Titolo del brano">
                    
                    <select class="song-part-select" onchange="updateSongInfo(${songIndex}, 'part', this.value)">
                        <option value="Accompagnamento" ${song.part === 'Accompagnamento' ? 'selected' : ''}>Accompagnamento</option>
                        <option value="Assolo" ${song.part === 'Assolo' ? 'selected' : ''}>Assolo</option>
                        <option value="Intro / Riff" ${song.part === 'Intro / Riff' ? 'selected' : ''}>Intro / Riff</option>
                        <option value="Clean / Arpeggio" ${song.part === 'Clean / Arpeggio' ? 'selected' : ''}>Clean / Arpeggio</option>
                    </select>

                    <div class="chain-container">
                        ${chainHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            localStorage.setItem('sparkPresetsV5', JSON.stringify(songs));
        }

        function togglePedal(songIndex, slotIndex) {
            let slot = songs[songIndex].chain[slotIndex];
            if (slot.name !== "Nessun Pedale") {
                slot.status = slot.status === "on" ? "off" : "on";
                renderApp();
            }
        }

        function updateSongInfo(songIndex, field, value) { 
            songs[songIndex][field] = value; 
            renderApp(); 
        }
        
        function updatePedal(songIndex, slotIndex, newPedalName) {
            const category = songs[songIndex].chain[slotIndex].category;
            const pedalData = catalog[category].find(p => p.name === newPedalName);
            
            if (pedalData) {
                songs[songIndex].chain[slotIndex].name = pedalData.name;
                songs[songIndex].chain[slotIndex].img = pedalData.img;
                songs[songIndex].chain[slotIndex].status = "on"; 
                songs[songIndex].chain[slotIndex].paramValues = pedalData.params ? pedalData.params.map(() => "5") : [];
            }
            renderApp();
        }

        function updateParamValue(songIndex, slotIndex, paramIndex, value) {
            songs[songIndex].chain[slotIndex].paramValues[paramIndex] = value;
            renderApp();
        }

        function addSong() { 
            songs.unshift(JSON.parse(JSON.stringify(defaultSong))); 
            renderApp(); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteSong(index) { 
            if(confirm("Vuoi eliminare questo preset?")) { 
                songs.splice(index, 1); 
                renderApp(); 
            } 
        }

        window.onload = function() {
            if(songs.length === 0) addSong();
            else renderApp();
        };
    </script>
</body>
</html>
