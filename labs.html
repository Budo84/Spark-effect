<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark Tone Labs - Pro Edition</title>
    <script src="catalog.js"></script>
    <script src="cloud_presets.js"></script>
    <style>
        :root { --bg-dark: #121212; --bg-card: #1e1e1e; --text-main: #f0f0f0; --spark-gold: #d4af37; --spark-purple: #8e44ad; --input-bg: #333; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--spark-purple); padding-bottom: 15px; margin-bottom: 25px; }
        .btn-back { background-color: #444; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; }
        .labs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .lab-card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid #333; }
        h2 { color: var(--spark-gold); font-size: 1.2em; margin-top: 0; }
        select, button, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #555; background: var(--input-bg); color: white; cursor: pointer; }
        .btn-magic { background-color: var(--spark-purple); font-weight: bold; border: none; }
        .btn-save { background-color: #2ecc71; color: white; border: none; font-weight: bold; margin-top: 15px; display: none; }
        .result-box { margin-top: 15px; padding: 15px; background: #111; border-left: 4px solid var(--spark-purple); font-size: 0.9em; }
        .pedal-tag { display: inline-block; padding: 2px 6px; background: #333; border-radius: 4px; font-size: 0.8em; margin-right: 5px; color: var(--spark-gold); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧪 Tone Labs</h1>
        <a href="index.html" class="btn-back">⬅ Torna alla Scaletta</a>
    </div>

    <div class="labs-grid">
        <div class="lab-card">
            <h2>🧙‍♂️ Tone Wizard</h2>
            <select id="wizard-intent">
                <option value="rhythm">Rhythm (Clarity)</option>
                <option value="lead">Lead (Vocals)</option>
                <option value="solo">Solo (Sustain)</option>
                <option value="ambient">Ambient (Texture)</option>
            </select>
            <input type="text" id="wizard-title" placeholder="Nome brano...">
            <button class="btn-magic" onclick="runWizard()">✨ Genera</button>
            <div id="wizard-result" class="result-box" style="display:none"></div>
            <button id="save-wizard-btn" class="btn-save" onclick="saveWizard()">💾 Salva nella Scaletta</button>
        </div>

        <div class="lab-card">
            <h2>☁️ Cloud Explorer</h2>
            <input type="text" id="cloud-search" placeholder="🔍 Cerca artista o brano..." onkeyup="searchCloud(this.value)">
            <div id="cloud-results" class="result-box" style="display:none; max-height:200px; overflow-y:auto"></div>
            <div id="cloud-preview" class="result-box" style="display:none"></div>
            <button id="save-cloud-btn" class="btn-save" onclick="saveCloud()">💾 Salva nella Scaletta</button>
        </div>
    </div>

    <script>
        const wizardLogic = {
            rhythm: { gate: "01 NoisGate", comp: "Nessun Pedale", drive: "01 Booster", amp: "16 Plexiglas", mod: "Nessun Pedale", delay: "Nessun Pedale", reverb: "01 Room A", notes: "Mantieni il gain basso." },
            lead: { gate: "01 NoisGate", comp: "Nessun Pedale", drive: "03 Tube Drv", amp: "21 RB 101", mod: "Nessun Pedale", delay: "01 Digital", reverb: "04 Plate Short", notes: "Medie spinte." },
            solo: { gate: "01 NoisGate", comp: "01 LA Comp", drive: "12 Guitar Muff", amp: "24 SLO 100", mod: "02 Chorus", delay: "05 Multi Head", reverb: "06 Plate Rich", notes: "Sustain infinito." },
            ambient: { gate: "01 NoisGate", comp: "05 Optical", drive: "Nessun Pedale", amp: "01 Silver 120", mod: "06 UniVibe", delay: "03 Vintage", reverb: "05 Hall Amb.", notes: "Massima pulizia." }
        };

        let currentTone = null;

        function runWizard() {
            const data = wizardLogic[document.getElementById('wizard-intent').value];
            currentTone = { title: document.getElementById('wizard-title').value || "Wizard Tone", chain: data, notes: data.notes };
            document.getElementById('wizard-result').innerHTML = `<b>Catena:</b><br>${Object.keys(data).filter(k=>k!='notes').map(k=>`<span class="pedal-tag">${k.toUpperCase()}</span> ${data[k]}`).join('<br>')}`;
            document.getElementById('wizard-result').style.display = 'block';
            document.getElementById('save-wizard-btn').style.display = 'block';
        }

        function searchCloud(q) {
            const res = document.getElementById('cloud-results');
            if(q.length<2) { res.style.display='none'; return; }
            const filtered = cloudPresets.filter(p => p.title.toLowerCase().includes(q.toLowerCase()));
            res.innerHTML = filtered.map(p => `<div style="padding:8px; cursor:pointer" onclick='previewCloud(${JSON.stringify(p).replace(/'/g, "&apos;")})'>🎵 ${p.title}</div>`).join('');
            res.style.display = 'block';
        }

        function previewCloud(p) {
            currentTone = { title: p.title, chain: p.chain, notes: "Importato dal Cloud." };
            document.getElementById('cloud-results').style.display = 'none';
            document.getElementById('cloud-preview').innerHTML = Object.keys(p.chain).map(k=>`<span class="pedal-tag">${k.toUpperCase()}</span> ${p.chain[k]}`).join('<br>');
            document.getElementById('cloud-preview').style.display = 'block';
            document.getElementById('save-cloud-btn').style.display = 'block';
        }

        function saveToMain(title, chain, notes) {
            let songs = JSON.parse(localStorage.getItem('sparkPresetsV7')) || [];
            const categories = ["Gate", "Comp", "Drive", "Amp", "Mod", "Delay", "Reverb"];
            const newChain = categories.map(cat => {
                const name = chain[cat] || chain[cat.toLowerCase()] || "Nessun Pedale";
                return { category: cat, name: name, img: "", status: name==="Nessun Pedale"?"off":"on", paramValues: ["5","5","5","5","5","5"] };
            });
            const newSong = {
                title: title, activeMode: "cuffie", activePartIndex: 0, notes: notes,
                parts: [{ name: "Import", modes: { cuffie: JSON.parse(JSON.stringify(newChain)), input: JSON.parse(JSON.stringify(newChain)) } }]
            };
            // Logica Fender: toglie AMP
            newSong.parts[0].modes.input.find(s=>s.category==='Amp').name = "Nessun Pedale";
            songs.unshift(newSong); localStorage.setItem('sparkPresetsV7', JSON.stringify(songs));
            alert("Salvato!");
        }

        function saveWizard() { saveToMain(currentTone.title, currentTone.chain, currentTone.notes); }
        function saveCloud() { saveToMain(currentTone.title, currentTone.chain, currentTone.notes); }
    </script>
</body>
</html>
