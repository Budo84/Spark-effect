<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark Tone Labs - Pro Edition (Full PDF Integrated)</title>
    
    <script src="cloud_presets.js"></script>
    <script src="catalog.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --spark-gold: #d4af37;
            --spark-purple: #8e44ad;
            --input-bg: #333;
            --border-color: #2a2a2a;
            --tip-bg: #2d2615;
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            padding-bottom: 50px;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--spark-purple); padding-bottom: 15px; margin-bottom: 25px;
        }

        .header h1 { margin: 0; font-size: 1.8rem; }

        .btn-back {
            background-color: #444; color: white; text-decoration: none;
            padding: 8px 15px; border-radius: 6px; font-weight: bold; transition: background 0.2s;
        }
        .btn-back:hover { background-color: #555; }

        .labs-layout { display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media(min-width: 1024px) { .labs-layout { grid-template-columns: 320px 1fr; } }

        .sidebar-tools { display: flex; flex-direction: column; gap: 20px; }

        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: var(--spark-gold); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 15px; }

        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        select, input { width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-size: 1rem; }

        .btn-action { width: 100%; background-color: var(--spark-purple); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .problem-res { background-color: #252525; border-left: 4px solid var(--spark-purple); padding: 12px; border-radius: 4px; font-size: 0.95rem; line-height: 1.4; display: none; margin-top: 10px; }

        .encyclopedia-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .nav-tab { background-color: #222; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .nav-tab.active, .nav-tab:hover { background-color: var(--spark-purple); color: white; border-color: var(--spark-purple); }

        .pedal-catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .pedal-card { background-color: #252525; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; border-top: 4px solid var(--spark-gold); }

        .pedal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .pedal-title { margin: 0; font-size: 1.1rem; color: white; }
        
        .pedal-img-container { text-align: center; background: #121212; padding: 10px; border-radius: 6px; margin-bottom: 12px; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .pedal-img { max-width: 100%; max-height: 90px; object-fit: contain; }

        .knobs-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
        .knob-badge { background-color: #333; color: var(--spark-gold); font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; border: 1px solid #444; font-weight: bold; }

        .editable-desc { border: 1px dashed transparent; padding: 10px; border-radius: 6px; background-color: rgba(0,0,0,0.15); font-size: 0.9rem; line-height: 1.5; color: #ddd; flex-grow: 1; min-height: 80px; transition: all 0.2s; }
        .editable-desc:hover { border-color: var(--spark-gold); background-color: rgba(212, 175, 55, 0.03); cursor: text; }
        .editable-desc:focus { border-color: var(--spark-purple); background-color: rgba(142, 68, 173, 0.08); outline: none; }
        
        .quick-tip { background-color: var(--tip-bg); border-left: 3px solid var(--spark-gold); padding: 10px; margin-top: 10px; font-size: 0.85rem; border-radius: 0 4px 4px 0; }
        .quick-tip strong { color: var(--spark-gold); }
        
        hr { border: 0; height: 1px; background: var(--border-color); margin: 15px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Spark Tone Labs <span style="color: var(--spark-gold); font-size: 1rem;">Full Encyclopedia</span></h1>
        <a href="index.html" class="btn-back">← Torna all'Editor</a>
    </div>

    <div class="labs-layout">
        
        <div class="sidebar-tools">
            <div class="card">
                <h2>Cloud Preset Finder</h2>
                <input type="text" id="cloud-search" placeholder="Cerca artista o brano..." oninput="searchCloud()">
                <div id="cloud-preview" style="display:none; background:#252525; padding:12px; border-radius:6px; margin-bottom:15px;">
                    <h4 id="preview-title" style="margin:0 0 8px 0; color:var(--spark-gold);"></h4>
                    <p id="preview-details" style="margin:0; font-size:0.85rem; color:var(--text-muted);"></p>
                </div>
                <button id="save-cloud-btn" class="btn-action" style="display:none;" onclick="importCloudPreset()">Salva nella Scaletta</button>
            </div>

            <div class="card">
                <h2>Risoluzione Problemi (Da Manuale Spark)</h2>
                <select id="problem" onchange="solveProblem()">
                    <option value="">-- Seleziona un problema --</option>
                    <option value="muddy_rhythm">Ritmica impastata (accordi non definiti)</option>
                    <option value="weak_lead">Assolo debole (sepolto dai piatti/basso)</option>
                    <option value="laggy_metal">Riff metal veloci in ritardo (laggy)</option>
                    <option value="ice_pick">Suono troppo tagliente (fatica per le orecchie)</option>
                    <option value="ambient_mud">Accordi ambient distorti e dissonanti</option>
                    <option value="hum_singlecoil">Eccessivo ronzio (Hum) con i Single Coil</option>
                </select>
                <div id="problem-result" class="problem-res"></div>
            </div>
        </div>

        <div class="card">
            <h2>L'Enciclopedia Assoluta Spark (Traduzione Completa)</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: -10px; margin-bottom: 20px;">
                Tutte le descrizioni, i consigli e i parametri provengono meticolosamente dalla <em>Spark Tone Guide</em>.
            </p>

            <div id="encyclopedia-tabs" class="encyclopedia-nav">
                </div>
            
            <div id="catalog-pedals-area" class="pedal-catalog-grid"></div>
            <div id="guide-tips-area" style="display:none;"></div>
        </div>
    </div>

    <script>
        // TRADUZIONE CERTOSINA DI OGNI SINGOLO EFFETTO, CONTROLLO E CONSIGLIO DAL PDF
        const pdfDescriptions = {
            
            // ==========================================
            // GATE
            // ==========================================
            "01 NoisGate": `<strong>Cos'è:</strong> Agisce come un "addetto alla sicurezza" per il tuo segnale, lasciando passare il suono solo quando suoni. Rimane chiuso per bloccare fastidiosi ronzii e sibili durante i silenzi.<br><hr>
                            <strong>Spiegazione Controlli:</strong><br>
                            - <strong>Threshold (Soglia):</strong> La "linea sulla sabbia". Determina quanto deve essere forte un suono prima di essere ascoltato. Se troppo alta, taglierà la coda del sustain delle note.<br>
                            - <strong>Decay:</strong> Decide come si chiude il gate. Un decadimento veloce serve per riff metal stretti e ritmici (stutter/djent); uno lento permette agli assoli blues o classic rock di svanire in modo naturale.`,

            // ==========================================
            // COMPRESSORS E WAH
            // ==========================================
            "01 LA Comp": `<strong>Basato su:</strong> Teletronix LA-2A.<br>
                           <strong>Uso:</strong> Aggiunge un calore morbido e naturale in stile studio. Bilancia gentilmente il tuo volume senza sembrare un ovvio pedale effetto.<br>
                           <strong>Generi:</strong> Blues, Jazz, Pop, Ballate Pulite.<br><hr>
                           <div class="quick-tip"><strong>Consiglio (Volume Balancing):</strong> Usa il controllo "Level" per ottenere l'"Unity Gain" (stesso volume sia da acceso che da spento) o alzalo oltre per usarlo come un "Solo Boost" che taglia il mix.</div>`,
            
            "02 Sustain": `<strong>Basato su:</strong> Boss CS-3.<br>
                           <strong>Uso:</strong> Famoso per tenere le note per lungo tempo (sustain infinito) aggiungendo all'inizio di ogni pennata uno "schiocco" percussivo (click).<br>
                           <strong>Generi:</strong> Pop/Rock anni '80, Funk, Assoli Rock.<br><hr>
                           <strong>Controlli:</strong> Un <strong>Attack</strong> lento lascia passare il "crack" iniziale del plettro prima di comprimere; un attacco veloce afferra il suono all'istante, lisciando l'esecuzione.`,
            
            "03 Red Comp": `<strong>Basato su:</strong> MXR Dyna Comp.<br>
                           <strong>Uso:</strong> Crea un effetto "squash" estremo. Schiaccia pesantemente il segnale rendendolo compatto, essenziale per il suono scattante del Country.<br>
                           <strong>Generi:</strong> Country (Chicken Pickin'), Funk, Classic Rock.`,
            
            "04 Bass Comp": `<strong>Basato su:</strong> EBS MultiComp.<br>
                             <strong>Uso:</strong> Costruito per gestire le basse frequenze. Mantiene il suono di chitarre ribassate (Drop Tunings, 7/8 corde) o bassi estremamente stabile senza assottigliare gli acuti.<br>
                             <div class="quick-tip"><strong>Consiglio Multi-Band:</strong> Sostituiscilo ai comp standard se usi Humbucker molto spinti per stringere le corde basse "rimbombanti" (boomy) lasciando aperti i cantini.</div>`,
            
            "05 Optical": `<strong>Basato su:</strong> BBE Opto Stomp.<br>
                           <strong>Uso:</strong> Completamente "trasparente". Controlla i picchi di volume per mantenere l'esecuzione livellata senza alterare in alcun modo il sapore originale del tono.<br>
                           <strong>Generi:</strong> Acustica, Folk, Jazz, Indie.`,
            
            "J.H. Legendary Wah": `<strong>Basato su:</strong> Vox 846 (Il Wah di Jimi Hendrix).<br>
                                   <strong>Uso:</strong> Spazza un picco di frequenza mimando una voce umana. Usa l'Auto Mode per sweep ritmici sensibili alla forza della pennata o posizionalo fisso (cocked) per un "mid-boost" nasale e tagliente.`,

            // ==========================================
            // DRIVE E FUZZ
            // ==========================================
            "01 Booster": `<strong>Basato su:</strong> MXR Micro Amp.<br>
                           <strong>Uso:</strong> Clean boost puro. Aggiunge chiarezza, volume e corpo senza colorare il tuo tono.<br>
                           <strong>Generi:</strong> Pop, Funk, Country, Jazz.<br><hr>
                           <div class="quick-tip"><strong>Consiglio:</strong> Usalo davanti a un ampli valvolare per farlo saturare naturalmente o per alzare gli assoli sopra il mix.</div>`,
            
            "02 Clone Drv": `<strong>Basato su:</strong> Klon Centaur.<br>
                             <strong>Uso:</strong> Overdrive "Trasparente" leggendario. Aggiunge grinta, brillantezza e sensibilità tattile preservando il carattere dell'amplificatore.<br>
                             <strong>Generi:</strong> Indie, Alt-Rock, Blues, Country.`,
            
            "03 Tube Drv": `<strong>Basato su:</strong> Ibanez Tube Screamer.<br>
                            <strong>Uso:</strong> Lo standard dell'industria. Stringe gli ampli high-gain flaccidi fornendo medie vocali ("mid-hump") che aiutano i lead a tagliare un mix denso.<br>
                            <strong>Generi:</strong> Blues, Rock, Metal, Pop.<br><hr>
                            <div class="quick-tip"><strong>Consiglio Gain Stacking:</strong> Per il metal moderno, imposta il Drive a 0 e il Level a 10 davanti a un ampli high-gain per tagliare i bassi impastati e stringere il punch ritmico.</div>`,
            
            "04 Over Drv": `<strong>Basato su:</strong> Boss OD-1.<br>
                            <strong>Uso:</strong> Simile al Tube Drive ma con un clipping asimmetrico per un crunch leggermente più tagliente e grintoso. Ottimo per spingere ampli stile Marshall.<br>
                            <strong>Generi:</strong> Classic Rock, 80s Rock, Punk, Blues.`,
            
            "09 Fuzz Face": `<strong>Basato su:</strong> Dallas Arbiter Fuzz Face.<br>
                             <strong>Uso:</strong> Fuzz vintage: saturo, lanoso e selvaggio.<br>
                             <div class="quick-tip"><strong>Il Segreto:</strong> Risponde dinamicamente alla chitarra. Abbassa il volume sul tuo strumento per puliti cristallini, alzalo per la saturazione caotica totale.</div>`,
            
            "10 Black Op": `<strong>Basato su:</strong> ProCo RAT.<br>
                            <strong>Uso:</strong> Estremamente versatile. La manopola "Filter" permette di variare da un leggero overdrive fino a un muro di rumore quasi fuzz.<br>
                            <strong>Generi:</strong> Grunge, Post-Punk, Garage, Indie.`,
            
            "11 Bass Muff": `<strong>Basato su:</strong> EHX Bass Big Muff Pi.<br>
                             <strong>Uso:</strong> Un Big Muff sintonizzato in modo specifico per preservare le frequenze basse. Tono saturo e cremoso che non sparisce nel mix.`,
            
            "12 Guitar Muff": `<strong>Basato su:</strong> EHX Big Muff Pi.<br>
                               <strong>Uso:</strong> Sustain massiccio, simile a un violino, con fondo spesso. Scava brutalmente i medi creando un "muro di suono" gigante.<br>
                               <strong>Generi:</strong> Shoegaze, Stoner Rock, 90s Alt, Grunge.`,
            
            "13 Bassmaster": `<strong>Basato su:</strong> Maestro Brassmaster.<br>
                              <strong>Uso:</strong> Fuzz aggressivo per basso. Mantiene frequenze basse enormi per riff pesanti e aggiunge una distorsione "all'ottava superiore" unica.`,
            
            "14 SAB Driver": `<strong>Basato su:</strong> SansAmp Bass Driver DI.<br>
                              <strong>Uso:</strong> Circuito di modellazione analogica. Offre toni di distorsione densi "direct-to-console" famosi nei dischi alternative anni '90.`,
            
            "J.H. Axle Fuzz": `<strong>Basato su:</strong> Axis Fuzz.<br>
                               <strong>Uso:</strong> Fuzz al silicio high-gain con alti pungenti. Progettato per farsi strada facilmente in un mix denso con un'articolazione nitida e aggressiva.`,
            
            "J.H. Super Fuzz": `<strong>Basato su:</strong> Tone Bender MkII.<br>
                                <strong>Uso:</strong> Più stretto e focalizzato per il rock rispetto al Fuzz Face. Fornisce un sustain infinito per il riffing pesante.`,
            
            "J.H. Octave Fuzz": `<strong>Basato su:</strong> Octavia.<br>
                                 <strong>Uso:</strong> Aggiunge una nota alta stile synth (ottava superiore) sopra l'esecuzione. Funziona meglio sul pickup al manico sopra il 12° tasto per suoni urlanti alieni.`,
            
            "J.H. Fuzz Zone": `<strong>Basato su:</strong> Maestro FZ-1.<br>
                               <strong>Uso:</strong> Il suono di "Satisfaction". Ronzante, staccato e "gated" con un sustain brevissimo. Simula la texture retrò di un altoparlante rotto.`,

            // ==========================================
            // AMPS (CLEAN, CRUNCH, HIGH GAIN)
            // ==========================================
            "01 Silver 120": `<strong>Basato su:</strong> Roland JC-120 (Stato Solido).<br>
                              <strong>Uso:</strong> Leggendario per la sua cristallina immensa headroom ultra-pulita e per il chorus stereo 3D. Non va mai in distorsione, la perfetta piattaforma per pedali.<br>
                              <strong>Generi:</strong> Jazz, New Wave, Funk, Shoegaze.`,
            
            "02 Black Duo": `<strong>Basato su:</strong> Fender Twin Reverb.<br>
                             <strong>Uso:</strong> Lo standard d'oro del tono valvolare pulito. Noto per i medi scavati, gli alti scintillanti e l'enorme headroom che rimane pulito anche ad alto volume.`,
            
            "03 AD Clean": `<strong>Basato su:</strong> Orange AD30.<br>
                            <strong>Uso:</strong> Un tono pulito britannico più scuro e pastoso di un Vox. Offre una densa gamma media e una sensazione "spugnosa" che si rompe dolcemente se spinta.`,
            
            "04 Match Dc": `<strong>Basato su:</strong> Matchless DC30.<br>
                            <strong>Uso:</strong> Tono boutique di Classe A con una reattività tagliente come un rasoio. L'equalizzatore altamente interattivo consente puliti squillanti o overdrive ricchi di armoniche.`,
            
            "05 OSD 50": `<strong>Basato su:</strong> Dumble ODS 50.<br>
                          <strong>Uso:</strong> Il "Santo Graal" degli amplificatori. Celebre per il suo sustain fiorente, sensibile al tocco e per i suoi medi dolci simili a una voce che cantano senza asprezza.`,
            
            "08 Blues Boy": `<strong>Basato su:</strong> Fender Blues Junior.<br>
                             <strong>Uso:</strong> Scatolare e incisivo con una spessa frequenza media che va in breakup precocemente. Perfetto per locali e grintosi toni blues.`,
            
            "09 Tweed Bass": `<strong>Basato su:</strong> Fender Bassman.<br>
                              <strong>Uso:</strong> Il "nonno del Marshall". Drive organico e legnoso con dinamica sensibile al tocco: si ripulisce giocando col volume della chitarra.`,
            
            "10 Ac Boost": `<strong>Basato su:</strong> Vox AC30.<br>
                            <strong>Uso:</strong> Definisce il "British Chime". Alti vetrosi e un ruggito complesso sui medi che taglia ogni mix. Dispone del caratteristico scintillio "Top Boost".`,
            
            "11 Checkmate": `<strong>Basato su:</strong> Teisco Checkmate.<br>
                             <strong>Uso:</strong> Eccentrico ampli giapponese anni '60. Distorsione "trash", sottile e fragile che aggiunge carattere unico allo stile retro (Garage Rock, Lo-Fi).`,
            
            "12 Two Stone": `<strong>Basato su:</strong> Two-Rock Studio Pro 50.<br>
                             <strong>Uso:</strong> Drive e pulito ad altissima fedeltà. Progettato per la massima chiarezza e articolazione, lasciando brillare il vero suono di dita e chitarra.`,
            
            "15 Am. Dlx": `<strong>Basato su:</strong> Fender Tweed Deluxe.<br>
                           <strong>Uso:</strong> Il ringhio "Tweed". Distorsione sciolta e compressa famosa per il tipico "sag" in stile Neil Young.`,
            
            "16 Plexiglas": `<strong>Basato su:</strong> Marshall Super Lead 100.<br>
                             <strong>Uso:</strong> Il suono del rock and roll. Medio-alti aggressivi e un crunch stretto che definisce le chitarre hard rock anni '70/'80.`,
            
            "17 JM45": `<strong>Basato su:</strong> Marshall JTM45.<br>
                        <strong>Uso:</strong> Caldo, rotondo e blues. Attacco più morbido e un overdrive "cremoso" (fantastico con gli Humbucker stile AC/DC).`,
            
            "18 Lux Verb": `<strong>Basato su:</strong> Fender Deluxe Reverb.<br>
                            <strong>Uso:</strong> Puliti brillanti ideali per single-coil e una fantastica compressione valvolare in stile Blues se spinti ad alti volumi.`,
            
            "21 RB 101": `<strong>Basato su:</strong> Bogner Ecstasy.<br>
                          <strong>Uso:</strong> La modifica definitiva del suono britannico. Distorsione gommosa, scura e liquida con sustain infinito per una sensazione di esecuzione liscia e raffinata.`,
            
            "22 British 30": `<strong>Basato su:</strong> Orange (Crunch).<br>
                              <strong>Uso:</strong> Grinta britannica che risulta più scura e "fuzzy" di un Marshall o Vox. Medio-bassi spessi e texture di distorsione granulare.`,
            
            "23 Am. H.Gain": `<strong>Basato su:</strong> Mesa Boogie Mark IV.<br>
                              <strong>Uso:</strong> Il suono "California Lead". Bassi stretti, medi cantanti e l'iconico "scoop a V" dell'EQ perfetto per il Thrash Metal.`,
            
            "24 SLO 100": `<strong>Basato su:</strong> Soldano SLO-100.<br>
                           <strong>Uso:</strong> Il primo vero ampli high-gain boutique. Famoso per chiarezza e articolazione a livelli di gain estremi, colmando il divario tra Van Halen e il Metal.`,
            
            "25 YJM100": `<strong>Basato su:</strong> Marshall YJM100.<br>
                          <strong>Uso:</strong> La Plexi signature di Yngwie Malmsteen. Aggiunge booster integrato e noise gate per suonare ad alta velocità neoclassica in modo fluido.`,
            
            "26 Treadplate": `<strong>Basato su:</strong> Mesa Boogie Dual Rectifier.<br>
                              <strong>Uso:</strong> Il muro del suono. Rombo dei bassi massiccio e sciolto abbinato a un finale alto frizzante che ha definito l'hard rock anni '90 e Nu-Metal.`,
            
            "27 Insane": `<strong>Basato su:</strong> Peavey 5150 / EVH.<br>
                          <strong>Uso:</strong> Estremamente compresso, saturo e serrato. Progettato per la moderna precisione metal dove ogni palm mute deve essere percussivo e chiaro.`,
            
            "28 Insane 6508": `<strong>Basato su:</strong> Peavey 6505.<br>
                               <strong>Uso:</strong> Il suono del metal moderno. Noto per il suo ringhio crudo e aggressivo sui medi che attraversa in modo potente i mix più pesanti (Death Metal/Metalcore).`,
            
            "29 SwitchAxe": `<strong>Basato su:</strong> Hughes & Kettner TriAmp.<br>
                             <strong>Uso:</strong> Ampli valvolare programmabile noto per versatilità e chiarezza hi-fi. Offre un suono high-gain moderno e processato.`,
            
            "30 Rocker V": `<strong>Basato su:</strong> Orange Rockerverb.<br>
                            <strong>Uso:</strong> High gain denso, sfocato e scuro. Manca del 'frizz' americano, sostituendolo con un massiccio muro di saturazione sui medio-bassi (Doom/Stoner).`,
            
            "31 BE 101": `<strong>Basato su:</strong> Friedman BE-100.<br>
                          <strong>Uso:</strong> L'ultima "Hot-Rodded Plexi". Prende il ruggito britannico e vi aggiunge precisione e un basso rifinito ideale per il rock da stadio (Hair Metal 80s).`,

            // ==========================================
            // AMPS (ACOUSTIC & BASS)
            // ==========================================
            "32 Acoustic": `<strong>Amplificatore:</strong> Pure Acoustic.<br>
                            <strong>Uso:</strong> Preamplificatore acustico trasparente per amplificare i pickup piezoelettrici senza colorare il tono in modo significativo.`,
            
            "33 Fishboy": `<strong>Basato su:</strong> Fishman Acoustic Amp.<br>
                           <strong>Uso:</strong> Lo standard per suonare acustici dal vivo. Cattura la naturale risonanza del legno fornendo un'amplificazione pulita e resistente ai feedback.`,
            
            "34 Jumbo": `<strong>Amplificatore:</strong> Acoustic Jumbo.<br>
                         <strong>Uso:</strong> Simula l'enorme risonanza del corpo e la risposta dei bassi di una chitarra acustica Jumbo (es. Gibson J-200).`,
            
            "35 Flat Ac.": `<strong>Amplificatore:</strong> Flat Acoustic.<br>
                            <strong>Uso:</strong> Percorso del segnale senza colorazioni (piatto), destinato a suonare come una chitarra collegata direttamente alla console di mixaggio in studio.`,
            
            "36 RB 800": `<strong>Basato su:</strong> Amplificatore Standard per Basso.<br>
                          <strong>Uso:</strong> Tono solido e percussivo, un cavallo di battaglia per bassisti rock, metal e funk.`,
            
            "37 Sunny 3000": `<strong>Basato su:</strong> Testata valvolare massiccia per Basso.<br>
                              <strong>Uso:</strong> Headroom valvolare mostruosa, genera un muro di bassi mastodontico e caldo.`,
            
            "38 W600": `<strong>Basato su:</strong> Amplificatore moderno per Basso.<br>
                        <strong>Uso:</strong> Suono "Hi-Fi" e definito, ideale per tecniche moderne come slap e tapping complessi.`,
            
            "39 Hammer 500": `<strong>Basato su:</strong> Testata Boutique per Basso.<br>

        // CONTENUTI SPECIALI DELLA GUIDA PDF (TIPS & WORKFLOWS)
        const guideTipsHTML = `
            <h3>Architettura del Tono: I Pilastri (Da Manuale Spark)</h3>
            <p><strong>Rhythm Guitar:</strong> L'obiettivo è la <em>chiarezza prima della saturazione</em>. Usa un overdrive come il Tube Drive (Gain 0, Level 7) come filtro per tagliare le frequenze sub-basse (sotto i 100Hz) che altrimenti "impasterebbero" con il basso della traccia. Non usare riverberi Hall giganti per la ritmica, usa uno spring o una Room con decadimento basso.</p>
            <p><strong>Lead Guitar:</strong> Dominanza delle Medie. Usa il Guitar EQ per spingere le frequenze tra 800Hz e 1.6kHz. Usa un Digital Delay abbassando il mix per aggiungere un "alone" (halo) attorno alle note senza renderle confuse.</p>
            <p><strong>Solo Guitar:</strong> Massimo Sustain. Usa un Sustain Comp (alta compressione) all'inizio per livellare l'attacco. Riduci gli alti estremi (3.2kHz) per evitare l'effetto fastidioso "ice-pick" alle orecchie.</p>
            <p><strong>Ambient Guitar:</strong> Scegli ampli ultra puliti come il Silver 120 per non distorcere le complesse code dei delay. Spegni il Noise Gate e posiziona modulazioni (Chorus, Flanger) per dare vita a tappeti sintetici infiniti.</p>
            <hr>
            <h3>Guida ai Pickup & Gain Staging</h3>
            <ul>
                <li><strong>Humbucker:</strong> Essendo potenti e gonfi sui bassi, abbassa i bassi (Bass EQ a 3.0) sull'ampli o usa un compressore multibanda (Bass Comp) per contenere le frequenze gravi senza soffocare gli acuti.</li>
                <li><strong>Single Coil:</strong> Essendo più "magri", aggiungi un compressore Sustain Comp per ingrossare il suono, o un Booster pulito per spingere virtualmente le valvole senza perdere la brillantezza "a campana". Usa il Noise Gate per bloccare il rumore "60-cycle hum".</li>
                <li><strong>Attivi:</strong> Emettono un segnale enorme. Abbassa il Gain dell'amplificatore del 20-30% o abbassa il "Level" del tuo pedale overdrive per evitare che il preamp digitale si ingolfi e cracchi. Usa l'Optical Comp per ammorbidire la loro natura asettica.</li>
            </ul>
        `;

        // INIZIALIZZAZIONE INTERFACCIA
        function initEncyclopedia() {
            const tabsContainer = document.getElementById('encyclopedia-tabs');
            tabsContainer.innerHTML = '';

            // Estrae dinamicamente tutte le categorie da catalog.js
            Object.keys(catalog).forEach((category, index) => {
                const tab = document.createElement('div');
                tab.className = `nav-tab ${index === 0 ? 'active' : ''}`;
                tab.innerText = category;
                tab.onclick = () => {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderCategoryPedals(category);
                };
                tabsContainer.appendChild(tab);
            });

            // Tab Speciale Manuale PDF
            const tipTab = document.createElement('div');
            tipTab.className = `nav-tab`;
            tipTab.innerText = "📘 Manuale & Tips";
            tipTab.style.backgroundColor = "var(--spark-gold)";
            tipTab.style.color = "#000";
            tipTab.onclick = () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tipTab.classList.add('active');
                document.getElementById('catalog-pedals-area').style.display = 'none';
                
                const tipsArea = document.getElementById('guide-tips-area');
                tipsArea.innerHTML = guideTipsHTML;
                tipsArea.style.display = 'block';
            };
            tabsContainer.appendChild(tipTab);

            renderCategoryPedals(Object.keys(catalog)[0]);
        }

        function renderCategoryPedals(category) {
            const container = document.getElementById('catalog-pedals-area');
            const tipsArea = document.getElementById('guide-tips-area');
            
            container.style.display = 'grid';
            tipsArea.style.display = 'none';
            container.innerHTML = '';

            const pedals = catalog[category];
            pedals.forEach(pedal => {
                if (pedal.name === "Nessun Pedale") return;

                const card = document.createElement('div');
                card.className = 'pedal-card';

                let imgHTML = '';
                if (pedal.img) {
                    imgHTML = `
                        <div class="pedal-img-container">
                            <img src="${pedal.img}" class="pedal-img" alt="${pedal.name}" onerror="this.style.display='none'; this.parentNode.innerText='[Immagine]';">
                        </div>`;
                }

                let knobsHTML = '';
                if (pedal.params && pedal.params.length > 0) {
                    knobsHTML = `<div class="knobs-container">`;
                    pedal.params.forEach(param => {
                        knobsHTML += `<span class="knob-badge">${param}</span>`;
                    });
                    knobsHTML += `</div>`;
                }

                const savedDesc = pdfDescriptions[pedal.name] || `<strong>${pedal.name}</strong><br><em>Aggiungi appunti personali o seleziona un altro pedale mappato.</em>`;

                card.innerHTML = `
                    <div class="pedal-header">
                        <h3 class="pedal-title">${pedal.name}</h3>
                        <span style="font-size:0.75rem; color:var(--spark-gold); font-weight:bold;">${category}</span>
                    </div>
                    ${imgHTML}
                    <div style="margin-bottom: 8px;">
                        <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Controlli Disponibili (App):</span><br>
                        ${knobsHTML}
                    </div>
                    <div class="editable-desc" contenteditable="true" spellcheck="false" onblur="updateLocalNote('${pedal.name}', this.innerHTML)">
                        ${savedDesc}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function updateLocalNote(pedalName, htmlContent) {
            pdfDescriptions[pedalName] = htmlContent;
        }

        // -------------------------------------------------------------
        // FUNZIONI ORIGINALI (Cloud & Risoluzione Problemi PDF)
        // -------------------------------------------------------------
        let selectedCloudPreset = null;

        function searchCloud() {
            const query = document.getElementById('cloud-search').value.toLowerCase();
            const preview = document.getElementById('cloud-preview');
            const saveBtn = document.getElementById('save-cloud-btn');
            
            if (!query) { preview.style.display = 'none'; saveBtn.style.display = 'none'; return; }

            const found = cloudPresets.find(p => p.title.toLowerCase().includes(query));
            if (found) {
                selectedCloudPreset = found;
                document.getElementById('preview-title').innerText = found.title;
                document.getElementById('preview-details').innerText = `Amp: ${found.chain.Amp} | Drive: ${found.chain.Drive}`;
                preview.style.display = 'block'; saveBtn.style.display = 'block';
            } else {
                document.getElementById('preview-title').innerText = "Nessun preset trovato";
                document.getElementById('preview-details').innerText = "Cerca un altro brano o artista.";
                preview.style.display = 'block'; saveBtn.style.display = 'none';
            }
        }

        function importCloudPreset() {
            if (!selectedCloudPreset) return;
            let savedSongs = JSON.parse(localStorage.getItem('sparkPresetsV7')) || [];
            
            const newChain = [];
            Object.keys(selectedCloudPreset.chain).forEach(cat => {
                newChain.push({
                    category: cat,
                    name: selectedCloudPreset.chain[cat],
                    status: selectedCloudPreset.chain[cat] === "Nessun Pedale" ? "off" : "on",
                    paramValues: [50, 50, 50, 50, 50, 50]
                });
            });

            const newSong = {
                title: selectedCloudPreset.title,
                isSetlist: false,
                parts: [{ name: "Main", modes: { current: "input", backup: JSON.parse(JSON.stringify(newChain)), input: JSON.parse(JSON.stringify(newChain)) } }]
            };

            savedSongs.unshift(newSong);
            localStorage.setItem('sparkPresetsV7', JSON.stringify(savedSongs));
            
            alert(`✅ "${selectedCloudPreset.title}" aggiunto correttamente alla scaletta!`);
            document.getElementById('cloud-search').value = ""; searchCloud();
        }

        function solveProblem() {
            const prob = document.getElementById('problem').value;
            const solutions = {
                muddy_rhythm: "La saturazione alta distrugge la separazione delle corde. Riduci il gain dell'ampli e taglia i bassi. Usa un Tube Drive con Gain a 0 come filtro passa-alto.",
                weak_lead: "Aumenta le frequenze medie (tra 800Hz e 1.6kHz) con l'EQ. Non scavare mai le medie (no scoop), altrimenti sparirai dietro i piatti e il basso.",
                laggy_metal: "Passa da ampli vintage a modelli ad alto guadagno come Treadplate o BE 101. I modelli vintage hanno troppo 'tube sag' (compressione valvolare lenta) per ritmiche veloci in muting.",
                ice_pick: "Arretra le manopole Treble e Presence. La distorsione ad alto guadagno genera armoniche altissime fastidiose. Usa il Guitar EQ tagliando i 3.2kHz.",
                ambient_mud: "Passa a un ampli ultra-pulito come il Silver 120. Se sommi troppi delay e reverb in un ampli che 'satina' naturalmente le valvole, otterrai solo rumore dissonante.",
                hum_singlecoil: "Alza il Threshold del Noise Gate per bloccare il rumore '60-cycle'. Se il suono perde corpo, aggiungi il Sustain Comp all'inizio della catena per ingrossarlo."
            };
            const res = document.getElementById('problem-result'); 
            if(prob) {
                res.innerHTML = solutions[prob]; res.style.display = 'block';
            } else {
                res.style.display = 'none';
            }
        }

        window.onload = () => { initEncyclopedia(); };
    </script>
